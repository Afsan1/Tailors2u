<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <style>
      .shirt-body { fill: #FBF9F5; stroke: #DDD5C8; stroke-width: 1.2; }
      .shirt-placket { fill: #FFFFFF; stroke: #DDD5C8; stroke-width: 1; }
      .neck-back { fill: #C8B9A6; stroke: #6F5D4B; stroke-width: 1.8; stroke-linejoin: round; }
      .collar-wing { fill: #D6C5AF; stroke: #6F5D4B; stroke-width: 2; stroke-linejoin: round; }
      .pearl-btn { fill: #FFFFFF; stroke: #6F5D4B; stroke-width: 1.2; }
      .pearl-center { fill: #D6C5AF; }
    </style>
  </defs>

  <!-- 1. CLASSIC -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#EAE5DC" stroke-width="1.2"/>
    <path d="M 12 40 L 48 24 L 82 24 L 118 40 L 118 130 L 12 130 Z" class="shirt-body"/>
    <rect x="56" y="24" width="18" height="106" class="shirt-placket"/>
    <circle cx="65" cy="46" r="3.5" class="pearl-btn"/><circle cx="65" cy="46" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="74" r="3.5" class="pearl-btn"/><circle cx="65" cy="74" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="102" r="3.5" class="pearl-btn"/><circle cx="65" cy="102" r="1.5" class="pearl-center"/>
    <!-- Back neck -->
    <path d="M 46 16 C 46 4 84 4 84 16 C 84 26 46 26 46 16 Z" class="neck-back"/>
    <!-- Collar wings -->
    <path d="M 46 16 C 46 28 54 54 61 63 C 62 50 63 38 65 32 C 57 24 50 19 46 16 Z" class="collar-wing"/>
    <path d="M 84 16 C 84 28 76 54 69 63 C 68 50 67 38 65 32 C 73 24 80 19 84 16 Z" class="collar-wing"/>
  </g>

  <!-- 2. SPREAD -->
  <g transform="translate(155, 5)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#EAE5DC" stroke-width="1.2"/>
    <path d="M 12 40 L 48 24 L 82 24 L 118 40 L 118 130 L 12 130 Z" class="shirt-body"/>
    <rect x="56" y="24" width="18" height="106" class="shirt-placket"/>
    <circle cx="65" cy="46" r="3.5" class="pearl-btn"/><circle cx="65" cy="46" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="74" r="3.5" class="pearl-btn"/><circle cx="65" cy="74" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="102" r="3.5" class="pearl-btn"/><circle cx="65" cy="102" r="1.5" class="pearl-center"/>
    <path d="M 46 16 C 46 4 84 4 84 16 C 84 26 46 26 46 16 Z" class="neck-back"/>
    <path d="M 46 16 C 43 25 44 40 51 50 C 57 42 62 36 65 32 C 57 24 50 19 46 16 Z" class="collar-wing"/>
    <path d="M 84 16 C 87 25 86 40 79 50 C 73 42 68 36 65 32 C 73 24 80 19 84 16 Z" class="collar-wing"/>
  </g>

  <!-- 3. CUTAWAY -->
  <g transform="translate(300, 5)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#EAE5DC" stroke-width="1.2"/>
    <path d="M 12 40 L 48 24 L 82 24 L 118 40 L 118 130 L 12 130 Z" class="shirt-body"/>
    <rect x="56" y="24" width="18" height="106" class="shirt-placket"/>
    <circle cx="65" cy="46" r="3.5" class="pearl-btn"/><circle cx="65" cy="46" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="74" r="3.5" class="pearl-btn"/><circle cx="65" cy="74" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="102" r="3.5" class="pearl-btn"/><circle cx="65" cy="102" r="1.5" class="pearl-center"/>
    <path d="M 46 16 C 46 4 84 4 84 16 C 84 26 46 26 46 16 Z" class="neck-back"/>
    <path d="M 46 16 C 41 21 38 30 42 37 C 50 34 58 33 65 32 C 57 24 50 19 46 16 Z" class="collar-wing"/>
    <path d="M 84 16 C 89 21 92 30 88 37 C 80 34 72 33 65 32 C 73 24 80 19 84 16 Z" class="collar-wing"/>
  </g>

  <!-- 4. BUTTON DOWN -->
  <g transform="translate(445, 5)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#EAE5DC" stroke-width="1.2"/>
    <path d="M 12 40 L 48 24 L 82 24 L 118 40 L 118 130 L 12 130 Z" class="shirt-body"/>
    <rect x="56" y="24" width="18" height="106" class="shirt-placket"/>
    <circle cx="65" cy="46" r="3.5" class="pearl-btn"/><circle cx="65" cy="46" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="74" r="3.5" class="pearl-btn"/><circle cx="65" cy="74" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="102" r="3.5" class="pearl-btn"/><circle cx="65" cy="102" r="1.5" class="pearl-center"/>
    <path d="M 46 16 C 46 4 84 4 84 16 C 84 26 46 26 46 16 Z" class="neck-back"/>
    <path d="M 46 16 C 46 28 54 54 61 63 C 62 50 63 38 65 32 C 57 24 50 19 46 16 Z" class="collar-wing"/>
    <path d="M 84 16 C 84 28 76 54 69 63 C 68 50 67 38 65 32 C 73 24 80 19 84 16 Z" class="collar-wing"/>
    <circle cx="58" cy="58" r="2.2" fill="#FFFFFF" stroke="#6F5D4B" stroke-width="1.1"/>
    <circle cx="72" cy="58" r="2.2" fill="#FFFFFF" stroke="#6F5D4B" stroke-width="1.1"/>
  </g>

  <!-- 5. HIDDEN BUTTON -->
  <g transform="translate(590, 5)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#EAE5DC" stroke-width="1.2"/>
    <path d="M 12 40 L 48 24 L 82 24 L 118 40 L 118 130 L 12 130 Z" class="shirt-body"/>
    <rect x="56" y="24" width="18" height="106" class="shirt-placket"/>
    <circle cx="65" cy="46" r="3.5" class="pearl-btn"/><circle cx="65" cy="46" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="74" r="3.5" class="pearl-btn"/><circle cx="65" cy="74" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="102" r="3.5" class="pearl-btn"/><circle cx="65" cy="102" r="1.5" class="pearl-center"/>
    <path d="M 46 16 C 46 4 84 4 84 16 C 84 26 46 26 46 16 Z" class="neck-back"/>
    <path d="M 46 16 C 46 28 54 54 61 63 C 62 50 63 38 65 32 C 57 24 50 19 46 16 Z" class="collar-wing"/>
    <path d="M 84 16 C 84 28 76 54 69 63 C 68 50 67 38 65 32 C 73 24 80 19 84 16 Z" class="collar-wing"/>
    <!-- Folded under tab on right -->
    <path d="M 69 63 L 75 52 L 80 58 Z" fill="#8C7965" stroke="#6F5D4B" stroke-width="1.1"/>
    <circle cx="73" cy="58" r="1.8" fill="#FFFFFF" stroke="#6F5D4B" stroke-width="0.9"/>
  </g>

  <!-- 6. MANDARIN -->
  <g transform="translate(735, 5)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#EAE5DC" stroke-width="1.2"/>
    <path d="M 12 40 L 48 24 L 82 24 L 118 40 L 118 130 L 12 130 Z" class="shirt-body"/>
    <rect x="56" y="38" width="18" height="92" class="shirt-placket"/>
    <circle cx="65" cy="54" r="3.5" class="pearl-btn"/><circle cx="65" cy="54" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="82" r="3.5" class="pearl-btn"/><circle cx="65" cy="82" r="1.5" class="pearl-center"/>
    <circle cx="65" cy="110" r="3.5" class="pearl-btn"/><circle cx="65" cy="110" r="1.5" class="pearl-center"/>
    <path d="M 46 16 C 46 4 84 4 84 16 C 84 26 46 26 46 16 Z" class="neck-back"/>
    <!-- Mandarin Band -->
    <path d="M 44 20 C 44 10 86 10 86 20 C 86 32 72 38 65 38 C 58 38 44 32 44 20 Z" class="collar-wing"/>
    <circle cx="65" cy="30" r="3" class="pearl-btn"/><circle cx="65" cy="30" r="1.2" class="pearl-center"/>
  </g>
</svg>
