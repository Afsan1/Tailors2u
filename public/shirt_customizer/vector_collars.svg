  <!-- 4. BUTTON DOWN (x: 420) -->
  <g transform="translate(420, 10)">
    <rect x="5" y="0" width="130" height="140" rx="10" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5"/>
    <path d="M15 45 L50 32 L90 32 L125 45 L125 135 L15 135 Z" class="body-bg"/>
    <rect x="61" y="32" width="18" height="103" class="placket"/>
    <circle cx="70" cy="52" r="3.5" class="btn-outer"/><circle cx="70" cy="52" r="1.5" class="btn-inner"/>
    <circle cx="70" cy="80" r="3.5" class="btn-outer"/><circle cx="70" cy="80" r="1.5" class="btn-inner"/>
    <circle cx="70" cy="108" r="3.5" class="btn-outer"/><circle cx="70" cy="108" r="1.5" class="btn-inner"/>
    <path d="M48 24 C48 10 92 10 92 24 C92 34 48 34 48 24 Z" class="neck-band"/>
    <path d="M48 20 C46 36 54 64 66 70 C68 56 69 44 70 38 C60 28 52 22 48 20 Z" class="collar-leaf"/>
    <path d="M92 20 C94 36 86 64 74 70 C72 56 71 44 70 38 C80 28 88 22 92 20 Z" class="collar-leaf"/>
    <circle cx="63" cy="64" r="2" fill="#FFFFFF" stroke="#6F5D4B" stroke-width="1"/>
    <circle cx="77" cy="64" r="2" fill="#FFFFFF" stroke="#6F5D4B" stroke-width="1"/>
  </g>

  <!-- 5. HIDDEN BUTTON (x: 560) -->
  <g transform="translate(560, 10)">
    <rect x="5" y="0" width="130" height="140" rx="10" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5"/>
    <path d="M15 45 L50 32 L90 32 L125 45 L125 135 L15 135 Z" class="body-bg"/>
    <rect x="61" y="32" width="18" height="103" class="placket"/>
    <circle cx="70" cy="52" r="3.5" class="btn-outer"/><circle cx="70" cy="52" r="1.5" class="btn-inner"/>
    <circle cx="70" cy="80" r="3.5" class="btn-outer"/><circle cx="70" cy="80" r="1.5" class="btn-inner"/>
    <circle cx="70" cy="108" r="3.5" class="btn-outer"/><circle cx="70" cy="108" r="1.5" class="btn-inner"/>
    <path d="M48 24 C48 10 92 10 92 24 C92 34 48 34 48 24 Z" class="neck-band"/>
    <path d="M48 20 C46 36 54 64 66 70 C68 56 69 44 70 38 C60 28 52 22 48 20 Z" class="collar-leaf"/>
    <path d="M92 20 C94 36 86 64 74 70 C72 56 71 44 70 38 C80 28 88 22 92 20 Z" class="collar-leaf"/>
