    <path d="M74 70 L80 58 L86 64 Z" fill="#7A6852" stroke="#6F5D4B" stroke-width="1.2"/>
    <circle cx="78" cy="65" r="2" fill="#FFFFFF" stroke="#6F5D4B" stroke-width="1"/>
  </g>

  <!-- 6. MANDARIN (x: 700) -->
  <g transform="translate(700, 10)">
    <rect x="5" y="0" width="130" height="140" rx="10" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5"/>
