    <circle cx="70" cy="60" r="3.5" class="btn-outer"/><circle cx="70" cy="60" r="1.5" class="btn-inner"/>
    <circle cx="70" cy="88" r="3.5" class="btn-outer"/><circle cx="70" cy="88" r="1.5" class="btn-inner"/>
    <circle cx="70" cy="114" r="3.5" class="btn-outer"/><circle cx="70" cy="114" r="1.5" class="btn-inner"/>
    <path d="M48 24 C48 10 92 10 92 24 C92 34 48 34 48 24 Z" class="neck-band"/>
    <!-- Mandarin rounded collar band with center button -->
    <path d="M46 22 C46 14 94 14 94 22 C94 36 78 44 70 44 C62 44 46 36 46 22 Z" class="collar-leaf"/>
    <circle cx="70" cy="38" r="3" class="btn-outer"/><circle cx="70" cy="38" r="1.2" class="btn-inner"/>
  </g>
